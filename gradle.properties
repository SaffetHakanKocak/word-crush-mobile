# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# AGP 9.x yerleşik Kotlin desteği etkin; KSP'nin oluşturduğu kaynak dizinleri
# `kotlin.sourceSets` DSL'i üzerinden eklemesine izin veriyoruz. Yoksa build
# "Using kotlin.sourceSets DSL to add Kotlin sources is not allowed" hatası
# verir.
android.disallowKotlinSourceSets=false

# Not: `ksp.useKSP2=false` denemesi AGP 9.x'in built-in Kotlin desteğiyle
# uyumsuz ("Cannot query the value of property testedVariantArtifacts…");
# bu yüzden KSP2 açık bırakıldı. "unexpected jvm signature V" hatası
# @Upsert fonksiyonlarına `Long` dönüş tipi verilerek ve @Query tarafında
# default parametreler / nullable primitive dönüşler kaldırılarak çözüldü.

# Gradle'ın derleme sırasında kullanacağı JDK. Cursor/RedHat eklentisinin
# JRE'si `jlink.exe` içermediğinden JdkImageTransform adımını kırıyor.
# Android Studio'nun kendi JBR'ını gösteriyoruz; `jlink` + tüm JDK
# araçlarını içerir. Yol forward-slash ile yazılır (Windows backslash'in
# `.properties` dosyasında kaçırılmasını önlemek için).
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr

# AGP 9.x "Java Toolchain" otomatik keşfini kapat. Aksi halde PATH'te
# bulunan Cursor/RedHat JRE'si 21. sürüm toolchain kriterine uyduğu için
# otomatik seçiliyor. Yalnızca aşağıda belirtilen JDK'yı kullanmasını
# zorluyoruz.
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.fromEnv=
org.gradle.java.installations.paths=C:/Program Files/Android/Android Studio/jbr